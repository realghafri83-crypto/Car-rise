<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>سباق العملات والأزواج العددية</title><style>*{box-sizing:border-box}body{margin:0;background:#10263c;color:white;font-family:Tahoma,Arial;text-align:center}h1{font-size:clamp(20px,4vw,32px);margin:12px 0 4px}.by{color:#ffe18b;margin:0 0 9px}.wrap{max-width:510px;margin:auto;padding:0 10px}#hud{display:flex;justify-content:space-around;background:#23415d;padding:10px;border-radius:12px;margin-bottom:8px}canvas{display:block;width:100%;height:auto;border:4px solid #d7e4ed;border-radius:14px;touch-action:none;background:#4e555d}.controls{display:flex;gap:18px;justify-content:center;margin:10px}.controls button{font-size:28px;width:110px;height:60px;border:0;border-radius:16px;background:#ffc247;color:#14263b;touch-action:none}button{cursor:pointer}.overlay{position:fixed;inset:0;background:#061725d9;display:flex;align-items:center;justify-content:center;padding:18px;z-index:4}.panel{background:#fff;color:#12304b;border-radius:20px;padding:24px;max-width:430px;width:100%;box-shadow:0 10px 35px #0006}.panel h2{margin-top:0}.answer{display:block;width:100%;font-size:24px;background:#e7f1ff;color:#12304b;border:2px solid #8bb7df;border-radius:12px;padding:12px;margin:9px 0}.primary{background:#ffc247;color:#14263b;font-size:20px;font-weight:bold;border:0;border-radius:12px;padding:13px 30px}.hint{font-size:13px;color:#d2e7f7;margin:8px}.hidden{display:none}</style></head><body><div class="wrap"><h1>🏎️ سباق العملات الذهبية 🪙</h1><p class="by">الأزواج العددية بين ١٠ و٢٠ | إعداد الأستاذة: مريم الغافري</p><div id="hud"><span>🪙 العملات: <b id="coins">٠</b></span><span>⭐ النقاط: <b id="score">٠</b></span><span>❤️ <b id="hearts">٣</b></span></div><canvas id="game" width="420" height="590"></canvas><div class="controls"><button id="right" aria-label="يمين">➡️</button><button id="left" aria-label="يسار">⬅️</button></div><p class="hint">حرّك السيارة بالأسهم أو اللمس لجمع العملات وتجنب الحواجز الحمراء. بعد كل ٣ عملات يظهر سؤال رياضيات.</p></div><div id="overlay" class="overlay"><div class="panel" id="panel"></div></div><script>
const cv=document.getElementById('game'),ctx=cv.getContext('2d'),overlay=document.getElementById('overlay'),panel=document.getElementById('panel');const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[+d]);let lane=1,items=[],coins=0,score=0,hearts=3,playing=false,paused=true,last=0,spawn=0,scroll=0,questionIndex=0;const lanes=[105,210,315],carY=480;const questions=[{t:14,a:10,opts:[3,4,5]},{t:16,a:8,opts:[6,8,9]},{t:15,a:9,opts:[5,6,7]},{t:19,a:10,opts:[7,8,9]},{t:17,a:8,opts:[7,9,10]},{t:18,a:6,opts:[10,11,12]},{t:16,a:9,opts:[6,7,8]},{t:13,a:5,opts:[6,7,8]},{t:18,a:10,opts:[6,7,8]}];function update(){document.getElementById('coins').textContent=ar(coins);document.getElementById('score').textContent=ar(score);document.getElementById('hearts').textContent=ar(hearts)}function show(html){panel.innerHTML=html;overlay.classList.remove('hidden')}function hide(){overlay.classList.add('hidden')}function start(){lane=1;items=[];coins=score=0;hearts=3;spawn=scroll=questionIndex=0;playing=true;paused=false;last=performance.now();update();hide();requestAnimationFrame(frame)}function ask(){paused=true;const q=questions[questionIndex%questions.length];questionIndex++;show(`<h2>🧠 تحدي الأزواج العددية</h2><p style="font-size:25px">${ar(q.a)} + ؟ = ${ar(q.t)}</p><p>اختر العدد المفقود لتحصل على ٥ نجوم!</p>${q.opts.map(x=>`<button class="answer" onclick="answer(${x},${q.t-q.a})">${ar(x)}</button>`).join('')}`)}function answer(v,correct){if(v===correct){score+=5;show(`<h2>🌟 أحسنت!</h2><p>إجابة صحيحة! ربحت ٥ نجوم.</p><button class="primary" onclick="resume()">تابع السباق 🏎️</button>`)}else{show(`<h2>💛 حاول مجددًا</h2><p>الإجابة الصحيحة هي ${ar(correct)}</p><button class="primary" onclick="resume()">تابع السباق 🏎️</button>`)}update()}function resume(){paused=false;last=performance.now();hide();requestAnimationFrame(frame)}function end(){playing=false;paused=true;show(`<h2>🏁 نهاية السباق</h2><p>جمعت ${ar(coins)} عملة و ${ar(score)} نقطة!</p><button class="primary" onclick="start()">العب مرة أخرى 🔄</button>`)}function move(d){if(playing&&!paused)lane=Math.max(0,Math.min(2,lane+d))}document.getElementById('left').addEventListener('pointerdown',e=>{e.preventDefault();move(-1)});document.getElementById('right').addEventListener('pointerdown',e=>{e.preventDefault();move(1)});window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','a','d'].includes(e.key)){e.preventDefault();move(e.key==='ArrowLeft'||e.key==='a'?-1:1)}});let tx=0;cv.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});cv.addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>25)move(d<0?1:-1)});cv.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){let r=cv.getBoundingClientRect();move(e.clientX<r.left+r.width/2?1:-1)}});function draw(){ctx.fillStyle='#367648';ctx.fillRect(0,0,420,590);ctx.fillStyle='#555d68';ctx.fillRect(52,0,316,590);ctx.fillStyle='#e9f2fa';ctx.fillRect(54,0,5,590);ctx.fillRect(361,0,5,590);ctx.fillStyle='#f6e29d';for(let y=-55+scroll%75;y<590;y+=75){ctx.fillRect(157,y,5,35);ctx.fillRect(262,y,5,35)}for(const o of items){ctx.font=o.type==='coin'?'35px Arial':'41px Arial';ctx.textAlign='center';ctx.fillText(o.type==='coin'?'🪙':'🚧',lanes[o.lane],o.y)}ctx.font='59px Arial';ctx.textAlign='center';ctx.fillText('🏎️',lanes[lane],carY+24)}function frame(now){if(!playing||paused)return;let dt=Math.min((now-last)/1000,.05);last=now;scroll+=210*dt;spawn+=dt;if(spawn>.85){spawn=0;items.push({lane:Math.floor(Math.random()*3),y:-40,type:Math.random()<.77?'coin':'barrier',hit:false})}for(const o of items){o.y+=210*dt;if(!o.hit&&o.lane===lane&&Math.abs(o.y-carY)<43){o.hit=true;if(o.type==='coin'){coins++;score++;update();if(coins%3===0){draw();ask();return}}else{hearts--;update();if(hearts<=0){draw();end();return}}}}items=items.filter(o=>o.y<650&&!o.hit);draw();requestAnimationFrame(frame)}draw();show('<h2>🎮 مستعد لسباق السيارات؟</h2><p>اجمع العملات الذهبية، وتجنب الحواجز، وحل أسئلة الأزواج العددية لتكسب النجوم!</p><p>استخدم أزرار اليمين واليسار أسفل الطريق.</p><button class="primary" onclick="start()">🚦 ابدأ السباق</button>');
</script></body></html>
